<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Token Monitor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;color:#e0e0e0;overflow-x:hidden;overflow-y:auto;user-select:none}
body::-webkit-scrollbar{width:3px}
body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}

/* ── Theme variables ── */
:root{
  --bg:rgba(20,20,26,0.86);--border:rgba(255,255,255,0.07);
  --card:rgba(255,255,255,0.025);--card-border:rgba(255,255,255,0.04);
  --text:#e0e0e0;--text2:#888;--text3:#555;
  --accent:#4ade80;--accent-bg:rgba(74,222,128,0.08);
  --cost:#a78bfa;
}
body.light{
  --bg:rgba(245,245,250,0.92);--border:rgba(0,0,0,0.08);
  --card:rgba(0,0,0,0.03);--card-border:rgba(0,0,0,0.06);
  --text:#1a1a2e;--text2:#666;--text3:#999;
  --accent:#16a34a;--accent-bg:rgba(22,163,74,0.08);
  --cost:#7c3aed;
}

.container{
  background:var(--bg);
  backdrop-filter:blur(40px) saturate(180%);
  -webkit-backdrop-filter:blur(40px) saturate(180%);
  border:1px solid var(--border);
  border-radius:14px;padding:12px 14px;
  display:flex;flex-direction:column;gap:6px;
  min-height:100vh;color:var(--text);
}

/* ── Titlebar ── */
.titlebar{-webkit-app-region:drag;display:flex;align-items:center;justify-content:space-between;padding-bottom:2px}
.tl{display:flex;align-items:center;gap:6px}
.close-btn{-webkit-app-region:no-drag;width:11px;height:11px;border-radius:50%;background:#ff5f57;border:none;cursor:pointer;transition:opacity .15s}
.close-btn:hover{opacity:.7}
.title{font-size:12px;font-weight:600;letter-spacing:.2px}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── Tabs ── */
.tabs{display:flex;gap:3px;-webkit-app-region:no-drag}
.tab{font-size:9px;padding:2px 7px;border-radius:5px;background:var(--card);border:1px solid var(--card-border);color:var(--text3);cursor:pointer;font-family:inherit;font-weight:500;transition:all .15s}
.tab:hover{color:var(--text2)}
.tab.active{color:var(--accent);background:var(--accent-bg);border-color:rgba(74,222,128,0.15)}

/* ── Range sub-tabs ── */
.range-tabs{display:flex;gap:2px;margin-bottom:2px}
.range-tab{font-size:8px;padding:2px 8px;border-radius:4px;background:transparent;border:1px solid transparent;color:var(--text3);cursor:pointer;font-family:inherit;font-weight:500;transition:all .15s}
.range-tab:hover{color:var(--text2)}
.range-tab.active{color:var(--accent);background:var(--accent-bg);border-color:rgba(74,222,128,0.12)}

/* ── Model rows ── */
.model-row{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;background:var(--card);border:1px solid var(--card-border);border-radius:7px}
.mr-left{display:flex;flex-direction:column}
.mr-name{font-size:9px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.mr-name .est{font-size:7px;color:#f59e0b;margin-left:2px}
.mr-right{display:flex;gap:8px;align-items:center}
.ms{display:flex;flex-direction:column;align-items:flex-end}
.ms .lbl{font-size:7px;color:var(--text3);text-transform:uppercase;letter-spacing:.3px;line-height:1}
.ms .val{font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.ms .val.cost{color:var(--cost)}

/* ── Totals ── */
.totals-bar{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;background:var(--card);border:1px solid var(--card-border);border-radius:7px}
.tb-label{font-size:8px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;font-weight:500}
.tb-value{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.tb-value.cost{color:var(--cost)}

/* ── History ── */
.hist-toggle{font-size:9px;color:var(--text3);cursor:pointer;display:flex;align-items:center;gap:4px;transition:color .15s;padding:2px 0}
.hist-toggle:hover{color:var(--text2)}
.hist-toggle .arrow{transition:transform .2s;display:inline-block;font-size:7px}
.hist-toggle .arrow.open{transform:rotate(90deg)}
.hist-panel{max-height:0;overflow:hidden;transition:max-height .3s ease}
.hist-panel.open{max-height:2000px;overflow-y:auto}
.hist-tabs{display:flex;gap:3px;margin:4px 0}
.chart-wrap{position:relative;height:100px;margin:4px 0}
canvas{width:100%!important;height:100%!important;border-radius:6px}
.chart-tooltip{position:absolute;pointer-events:none;background:rgba(0,0,0,0.85);color:#fff;font-size:9px;padding:4px 8px;border-radius:5px;white-space:nowrap;opacity:0;transition:opacity .15s;z-index:10}

/* ── Provider cards ── */
.prov-card{background:var(--card);border:1px solid var(--card-border);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.prov-header{display:flex;justify-content:space-between;align-items:center}
.prov-name{font-size:10px;font-weight:600}
.prov-badge{font-size:8px;padding:1px 5px;border-radius:4px}
.prov-badge.sub{color:#60a5fa;background:rgba(96,165,250,0.1)}
.prov-badge.payg{color:#4ade80;background:rgba(74,222,128,0.1)}
.prov-badge.plan{color:#facc15;background:rgba(250,204,21,0.1)}
.prov-badge.credits{color:#f97316;background:rgba(249,115,22,0.1)}
.prov-row{display:flex;justify-content:space-between;font-size:9px}
.pl{color:var(--text3)}
.pv{color:var(--text2);font-variant-numeric:tabular-nums}
.pv.ok{color:#4ade80}.pv.warn{color:#f87171}
.quota-bar-bg{height:4px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;margin:2px 0}
.quota-bar{height:100%;border-radius:2px;transition:width .4s ease}
.quota-bar.green{background:linear-gradient(90deg,#22c55e,#4ade80)}
.quota-bar.yellow{background:linear-gradient(90deg,#eab308,#facc15)}
.quota-bar.red{background:linear-gradient(90deg,#dc2626,#f87171)}
.prov-alert{font-size:8px;color:#f87171;background:rgba(248,113,113,0.1);padding:2px 6px;border-radius:4px;margin-top:2px}

/* ── Settings ── */
.settings-section{display:flex;flex-direction:column;gap:6px}
.setting-group{background:var(--card);border:1px solid var(--card-border);border-radius:8px;padding:8px 10px}
.setting-group h3{font-size:10px;font-weight:600;margin-bottom:6px;color:var(--text2)}
.setting-row{display:flex;justify-content:space-between;align-items:center;font-size:9px;padding:3px 0}
.setting-row label{color:var(--text2)}
.setting-row select,.setting-row input{
  font-size:9px;padding:2px 6px;border-radius:4px;
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
  color:var(--text);font-family:inherit;outline:none;
}
.setting-row select{-webkit-appearance:none;padding-right:14px}
.btn-row{display:flex;gap:4px;margin-top:4px}
.btn{font-size:9px;padding:3px 10px;border-radius:5px;border:1px solid var(--card-border);background:var(--card);color:var(--text2);cursor:pointer;font-family:inherit;transition:all .15s}
.btn:hover{background:rgba(255,255,255,0.08);color:var(--text)}
.btn.primary{background:var(--accent-bg);color:var(--accent);border-color:rgba(74,222,128,0.2)}
.btn.danger{color:#f87171;border-color:rgba(248,113,113,0.2)}

/* ── Onboarding ── */
.onboarding{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px 20px;text-align:center}
.onboarding h2{font-size:14px;font-weight:600}
.onboarding p{font-size:10px;color:var(--text2);line-height:1.5}
.onboarding .step{display:flex;align-items:flex-start;gap:8px;text-align:left;width:100%}
.onboarding .step-num{font-size:10px;font-weight:700;color:var(--accent);min-width:16px}
.onboarding .step-text{font-size:9px;color:var(--text2);line-height:1.4}

/* ── Footer ── */
.footer{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:2px}
.footer .info{font-size:8px;color:var(--text3)}
.footer .refresh-btn{-webkit-app-region:no-drag;font-size:8px;color:var(--text3);background:var(--card);border:1px solid var(--card-border);border-radius:4px;padding:2px 6px;cursor:pointer;font-family:inherit;transition:all .15s}
.footer .refresh-btn:hover{color:var(--text2)}

.spinner{display:inline-block;width:8px;height:8px;border:1.5px solid rgba(255,255,255,0.1);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.page{display:none}.page.active{display:flex;flex-direction:column;gap:6px}
</style>
</head>
<body>
<div class="container">
  <div class="titlebar">
    <div class="tl">
      <button class="close-btn" onclick="window.close()"></button>
      <span class="title">Token Monitor</span>
      <span class="live-dot"></span>
    </div>
    <div class="tabs">
      <button class="tab active" data-page="live">Live</button>
      <button class="tab" data-page="apis">APIs</button>
      <button class="tab" data-page="settings">⚙</button>
    </div>
  </div>

  <!-- ── Live ── -->
  <div class="page active" id="page-live">
    <div class="range-tabs">
      <button class="range-tab active" data-range="session">Session</button>
      <button class="range-tab" data-range="today">Today</button>
      <button class="range-tab" data-range="all">All Time</button>
    </div>
    <div id="modelsSection"></div>
    <div class="totals-bar">
      <div><span class="tb-label">Total</span></div>
      <div style="display:flex;gap:12px">
        <span class="tb-value" id="liveTotal">--</span>
        <span class="tb-value cost" id="liveCost">--</span>
      </div>
    </div>
    <div class="hist-toggle" id="histToggle">
      <span class="arrow" id="histArrow">▶</span><span>History</span>
    </div>
    <div class="hist-panel" id="histPanel">
      <div class="hist-tabs">
        <button class="tab active" data-days="7">7D</button>
        <button class="tab" data-days="30">30D</button>
        <button class="tab" data-days="90">90D</button>
      </div>
      <div class="chart-wrap">
        <canvas id="histChart"></canvas>
        <div class="chart-tooltip" id="chartTooltip"></div>
      </div>
    </div>
  </div>

  <!-- ── APIs ── -->
  <div class="page" id="page-apis">
    <div id="providersSection"></div>
  </div>

  <!-- ── Settings ── -->
  <div class="page" id="page-settings">
    <div id="settingsContent"></div>
  </div>

  <div class="footer">
    <span class="info" id="footerInfo">--</span>
    <button class="refresh-btn" onclick="refreshAll()">Refresh</button>
  </div>
</div>

<script>
const { ipcRenderer } = require('electron');

// ── Helpers ──
function fmt(n){if(n==null||isNaN(n))return'--';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return String(n)}
function fmtCost(n){if(n==null||isNaN(n))return'--';if(n>=1)return'$'+n.toFixed(2);if(n>=0.01)return'$'+n.toFixed(3);return'$'+n.toFixed(4)}
function shortModel(m){
  let s=(m||'');
  // Strip all provider prefixes (nvidia/, azure/, aws/, anthropic/, bedrock-, openrouter/, etc.)
  s=s.replace(/^(?:nvidia\/|azure\/|aws\/|openrouter\/|company-gateway\/|zai\/|minimax\/)*/, '');
  s=s.replace(/^(?:anthropic\/|models\/|bedrock-)*/, '');
  // Normalize common model families
  s=s.replace(/-\d{8}$/,'');  // strip date suffixes
  return s;
}

// ── Page switching ──
let currentPage='live';
document.querySelectorAll('.tabs .tab[data-page]').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tabs .tab[data-page]').forEach(b=>b.classList.remove('active'));
    t.classList.add('active');
    currentPage=t.dataset.page;
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById('page-'+currentPage).classList.add('active');
    if(currentPage==='apis')refreshProviders();
    if(currentPage==='settings')renderSettings();
  });
});

// ── Range switching ──
let currentRange='session';
document.querySelectorAll('.range-tabs .range-tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.range-tabs .range-tab').forEach(b=>b.classList.remove('active'));
    t.classList.add('active');
    currentRange=t.dataset.range;
    refreshLive();
  });
});

// ── Theme ──
async function applyTheme(){
  const{isDark}=await ipcRenderer.invoke('get-theme');
  document.body.classList.toggle('light',!isDark);
}
applyTheme();
ipcRenderer.on('theme-changed',(e,isDark)=>{document.body.classList.toggle('light',!isDark)});

// ══════════════════════════════════════════════════════════════
// LIVE TAB
// ══════════════════════════════════════════════════════════════

function updateLive(sessions){
  const sec=document.getElementById('modelsSection');
  if(!sessions||!sessions.length){sec.innerHTML='<div style="font-size:10px;color:var(--text3);text-align:center;padding:20px">No OpenClaw sessions detected</div>';return}
  // Merge sessions by model name
  const byModel={};
  for(const s of sessions){
    const key=shortModel(s.model);
    if(!byModel[key])byModel[key]={model:s.model,input:0,output:0,total:0,cost:0,estimated:false,sessions:0};
    byModel[key].input+=s.input||0;
    byModel[key].output+=s.output||0;
    byModel[key].total+=s.total||0;
    byModel[key].cost+=s.cost||0;
    if(s.estimated)byModel[key].estimated=true;
    byModel[key].sessions++;
  }
  const merged=Object.values(byModel).sort((a,b)=>(b.total||0)-(a.total||0));
  let totalTokens=0,totalCost=0;
  sec.innerHTML=merged.map(s=>{
    const cost=s.cost||0;totalTokens+=s.total||0;totalCost+=cost;
    const estTag=s.estimated?'<span class="est">~est</span>':'';
    const countTag=s.sessions>1?`<span style="font-size:7px;color:var(--text3);margin-left:3px">×${s.sessions}</span>`:'';
    return`<div class="model-row">
      <div class="mr-left"><span class="mr-name" title="${s.model} (${s.sessions} sessions)">${shortModel(s.model)}${countTag}${estTag}</span></div>
      <div class="mr-right">
        <div class="ms"><span class="lbl">In</span><span class="val">${fmt(s.input)}</span></div>
        <div class="ms"><span class="lbl">Out</span><span class="val">${fmt(s.output)}</span></div>
        <div class="ms"><span class="lbl">Cost</span><span class="val cost">${fmtCost(cost)}</span></div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('liveTotal').textContent=fmt(totalTokens);
  document.getElementById('liveCost').textContent=fmtCost(totalCost);
}

// ── History chart ──
let histData=null,histDays=7,histExpanded=false;

document.getElementById('histToggle').addEventListener('click',()=>{
  histExpanded=!histExpanded;
  document.getElementById('histPanel').classList.toggle('open',histExpanded);
  document.getElementById('histArrow').classList.toggle('open',histExpanded);
  if(histExpanded&&histData)drawChart();
});

document.querySelectorAll('.hist-tabs .tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.hist-tabs .tab').forEach(b=>b.classList.remove('active'));
    t.classList.add('active');
    histDays=parseInt(t.dataset.days);
    drawChart();
  });
});

function filterDays(records,days){
  const cutoff=new Date();cutoff.setDate(cutoff.getDate()-days);
  const cs=cutoff.toISOString().slice(0,10);
  // Aggregate by date
  const byDate={};
  for(const r of records){
    if(r.date<cs)continue;
    if(!byDate[r.date])byDate[r.date]={date:r.date,tokens:0,cost:0,input:0,output:0,reqs:0};
    byDate[r.date].tokens+=r.totalTokens||0;
    byDate[r.date].cost+=r.costTotal||0;
    byDate[r.date].input+=r.input||0;
    byDate[r.date].output+=r.output||0;
    byDate[r.date].reqs++;
  }
  // Fill gaps
  const result=[];
  const d=new Date(cutoff);
  const today=new Date().toISOString().slice(0,10);
  while(d.toISOString().slice(0,10)<=today){
    const ds=d.toISOString().slice(0,10);
    result.push(byDate[ds]||{date:ds,tokens:0,cost:0,input:0,output:0,reqs:0});
    d.setDate(d.getDate()+1);
  }
  return result;
}

function drawChart(){
  if(!histData)return;
  const data=filterDays(histData,histDays);
  const canvas=document.getElementById('histChart');
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.parentElement.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  ctx.scale(dpr,dpr);
  const W=rect.width,H=rect.height;
  const pad={t:8,b:18,l:4,r:4};
  const cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;

  ctx.clearRect(0,0,W,H);

  if(!data.length)return;
  const maxT=Math.max(...data.map(d=>d.tokens),1);

  // Grid lines
  ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=0.5;
  for(let i=0;i<4;i++){
    const y=pad.t+ch*(i/3);
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
  }

  // Token area + line
  const pts=data.map((d,i)=>({x:pad.l+(i/(data.length-1||1))*cw,y:pad.t+ch*(1-d.tokens/maxT),d}));

  // Area fill
  ctx.beginPath();ctx.moveTo(pts[0].x,pad.t+ch);
  pts.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.lineTo(pts[pts.length-1].x,pad.t+ch);ctx.closePath();
  const grad=ctx.createLinearGradient(0,pad.t,0,pad.t+ch);
  grad.addColorStop(0,'rgba(99,102,241,0.25)');grad.addColorStop(1,'rgba(99,102,241,0.02)');
  ctx.fillStyle=grad;ctx.fill();

  // Line
  ctx.beginPath();pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.strokeStyle='#6366f1';ctx.lineWidth=1.5;ctx.stroke();

  // Dots
  pts.forEach(p=>{
    if(p.d.tokens>0){
      ctx.beginPath();ctx.arc(p.x,p.y,2,0,Math.PI*2);ctx.fillStyle='#818cf8';ctx.fill();
    }
  });

  // X labels
  ctx.fillStyle='rgba(255,255,255,0.3)';ctx.font='7px -apple-system';ctx.textAlign='center';
  const step=Math.max(1,Math.floor(data.length/6));
  data.forEach((d,i)=>{if(i%step===0||i===data.length-1)ctx.fillText(d.date.slice(5),pts[i].x,H-2)});

  // Store points for tooltip
  canvas._pts=pts;
}

// Chart tooltip
const chartCanvas=document.getElementById('histChart');
const tooltip=document.getElementById('chartTooltip');
chartCanvas.addEventListener('mousemove',e=>{
  if(!chartCanvas._pts||!chartCanvas._pts.length){tooltip.style.opacity='0';return}
  const rect=chartCanvas.getBoundingClientRect();
  const mx=e.clientX-rect.left;
  let closest=chartCanvas._pts[0],minDist=Infinity;
  for(const p of chartCanvas._pts){const d=Math.abs(p.x-mx);if(d<minDist){minDist=d;closest=p}}
  if(minDist>30){tooltip.style.opacity='0';return}
  const d=closest.d;
  tooltip.innerHTML=`<b>${d.date}</b><br>Tokens: ${fmt(d.tokens)}<br>In: ${fmt(d.input)} / Out: ${fmt(d.output)}<br>Cost: ${fmtCost(d.cost)}<br>Requests: ${d.reqs}`;
  tooltip.style.opacity='1';
  let tx=closest.x+8;if(tx+120>rect.width)tx=closest.x-120;
  tooltip.style.left=tx+'px';tooltip.style.top=(closest.y-10)+'px';
});
chartCanvas.addEventListener('mouseleave',()=>{tooltip.style.opacity='0'});

// ══════════════════════════════════════════════════════════════
// APIS TAB
// ══════════════════════════════════════════════════════════════

function renderProviders(providers){
  const sec=document.getElementById('providersSection');
  if(!providers||!providers.length){
    sec.innerHTML='<div class="onboarding"><h2>No Providers Configured</h2><p>Add your API providers in Settings to see balance and usage.</p><div class="step"><span class="step-num">1</span><span class="step-text">Click the ⚙ tab</span></div><div class="step"><span class="step-num">2</span><span class="step-text">Click "Add Provider" and select your API</span></div><div class="step"><span class="step-num">3</span><span class="step-text">Enter your API key — it stays encrypted on your machine</span></div></div>';
    return;
  }
  sec.innerHTML=providers.map(p=>{
    if(p.error)return`<div class="prov-card"><div class="prov-header"><span class="prov-name">${p.name||p.provider}</span><span class="prov-badge" style="color:#f87171">error</span></div><div class="prov-row"><span class="pl">Error</span><span class="pv warn">${p.error}</span></div></div>`;

    let badge='',rows='',alert='';
    const t=p.type||'';
    if(t==='subscription')badge='<span class="prov-badge sub">subscription</span>';
    else if(t==='coding-plan')badge='<span class="prov-badge plan">coding-plan</span>';
    else if(t==='credits')badge='<span class="prov-badge credits">credits</span>';
    else badge='<span class="prov-badge payg">pay-as-you-go</span>';

    // DeepSeek
    if(p.provider==='deepseek'||p.totalBalance!=null&&p.currency){
      const bal=p.totalBalance||0;const cur=p.currency||'';
      const pct=Math.min(100,Math.max(0,(bal/50)*100));
      const barCls=pct>50?'green':pct>20?'yellow':'red';
      rows=`<div class="prov-row"><span class="pl">Status</span><span class="pv ${p.available?'ok':'warn'}">${p.available?'Active':'Inactive'}</span></div>
        <div class="prov-row"><span class="pl">Balance</span><span class="pv">${cur} ${bal.toFixed(2)}</span></div>
        <div class="quota-bar-bg"><div class="quota-bar ${barCls}" style="width:${pct}%"></div></div>
        <div class="prov-row"><span class="pl">Topped Up</span><span class="pv">${cur} ${(p.toppedUpBalance||0).toFixed(2)}</span></div>`;
    }
    // Z.ai
    else if(p.windows){
      rows=`<div class="prov-row"><span class="pl">Plan</span><span class="pv">${p.plan||'--'}</span></div>`;
      for(const w of p.windows){
        const pct=w.pct||0;const barCls=pct<60?'green':pct<85?'yellow':'red';
        rows+=`<div class="prov-row"><span class="pl">${w.label}</span><span class="pv">${pct.toFixed(0)}%</span></div>
          <div class="quota-bar-bg"><div class="quota-bar ${barCls}" style="width:${pct}%"></div></div>`;
      }
    }
    // Laozhang
    else if(p.totalUsage!=null){
      const pct=p.hardLimit>0?Math.min(100,(p.totalUsage/p.hardLimit)*100):0;
      const barCls=pct<60?'green':pct<85?'yellow':'red';
      rows=`<div class="prov-row"><span class="pl">Usage</span><span class="pv">$${p.totalUsage.toFixed(2)}</span></div>
        <div class="quota-bar-bg"><div class="quota-bar ${barCls}" style="width:${pct}%"></div></div>
        <div class="prov-row"><span class="pl">Remaining</span><span class="pv">$${(p.remaining||0).toFixed(2)}</span></div>`;
    }
    // Qwen
    else if(p.cashBalance!=null){
      const bal=p.cashBalance||0;
      const pct=Math.min(100,Math.max(0,(bal/50)*100));
      const barCls=pct>50?'green':pct>20?'yellow':'red';
      rows=`<div class="prov-row"><span class="pl">Key</span><span class="pv ${p.keyStatus==='active'?'ok':'warn'}">${p.keyStatus||'--'}</span></div>
        <div class="prov-row"><span class="pl">Cash</span><span class="pv">¥${bal.toFixed(2)}</span></div>
        <div class="quota-bar-bg"><div class="quota-bar ${barCls}" style="width:${pct}%"></div></div>
        <div class="prov-row"><span class="pl">Coupon</span><span class="pv">¥${(p.couponBalance||0).toFixed(2)}</span></div>
        <div class="prov-row"><span class="pl">Monthly</span><span class="pv">¥${(p.monthlySpend||0).toFixed(2)}</span></div>`;
    }
    // OpenRouter
    else if(p.usage!=null&&p.limit!=null){
      const pct=p.limit>0?Math.min(100,(p.usage/p.limit)*100):0;
      const barCls=pct<60?'green':pct<85?'yellow':'red';
      rows=`<div class="prov-row"><span class="pl">Usage</span><span class="pv">$${p.usage.toFixed(4)}</span></div>
        <div class="quota-bar-bg"><div class="quota-bar ${barCls}" style="width:${pct}%"></div></div>
        <div class="prov-row"><span class="pl">Limit</span><span class="pv">${p.limit?'$'+p.limit:'Unlimited'}</span></div>`;
    }
    // Key validation only
    else if(p.keyStatus){
      rows=`<div class="prov-row"><span class="pl">Key</span><span class="pv ${p.keyStatus==='active'?'ok':'warn'}">${p.keyStatus}</span></div>`;
      if(p.note)rows+=`<div class="prov-row"><span class="pl">Note</span><span class="pv">${p.note}</span></div>`;
    }
    // Generic
    else{
      if(p.plan)rows+=`<div class="prov-row"><span class="pl">Plan</span><span class="pv">${p.plan}</span></div>`;
      if(p.quota)rows+=`<div class="prov-row"><span class="pl">Quota</span><span class="pv">${p.quota}</span></div>`;
      if(p.note)rows+=`<div class="prov-row"><span class="pl">Note</span><span class="pv">${p.note}</span></div>`;
    }

    if(p._alert)alert=`<div class="prov-alert">⚠ ${p._alert}</div>`;

    return`<div class="prov-card"><div class="prov-header"><span class="prov-name">${p.name}</span>${badge}</div>${rows}${alert}</div>`;
  }).join('');
}

// ══════════════════════════════════════════════════════════════
// SETTINGS TAB
// ══════════════════════════════════════════════════════════════

let providerRegistry={};
(async()=>{providerRegistry=await ipcRenderer.invoke('get-provider-registry')})();

async function renderSettings(){
  const cfg=await ipcRenderer.invoke('get-config');
  const sec=document.getElementById('settingsContent');
  const theme=cfg.settings?.theme||'system';
  const tokenAlert=cfg.settings?.tokenAlertThreshold||50000;

  let providersHtml=(cfg.providers||[]).map((p,i)=>{
    const masked=p.config?._apiKeyMasked||'****';
    return`<div class="prov-row" style="padding:4px 0;border-bottom:1px solid var(--card-border)">
      <span class="pv">${p.name||p.type} <span style="color:var(--text3)">${masked}</span></span>
      <button class="btn danger" onclick="removeProvider(${i})" style="font-size:8px;padding:1px 6px">✕</button>
    </div>`;
  }).join('');

  let regOptions=Object.entries(providerRegistry).map(([id,def])=>`<option value="${id}">${def.name}</option>`).join('');

  sec.innerHTML=`
    <div class="setting-group">
      <h3>Appearance</h3>
      <div class="setting-row"><label>Theme</label>
        <select id="themeSelect" onchange="saveTheme(this.value)">
          <option value="system" ${theme==='system'?'selected':''}>System</option>
          <option value="dark" ${theme==='dark'?'selected':''}>Dark</option>
          <option value="light" ${theme==='light'?'selected':''}>Light</option>
        </select>
      </div>
    </div>
    <div class="setting-group">
      <h3>Alerts</h3>
      <div class="setting-row"><label>Session token alert threshold</label>
        <input type="number" value="${tokenAlert}" style="width:60px" onchange="saveTokenAlert(this.value)">
      </div>
    </div>
    <div class="setting-group">
      <h3>API Providers (${(cfg.providers||[]).length})</h3>
      ${providersHtml||'<div style="font-size:9px;color:var(--text3);padding:4px 0">No providers configured</div>'}
      <div class="btn-row" style="margin-top:6px">
        <select id="addProviderType" style="font-size:9px;flex:1">${regOptions}</select>
        <button class="btn primary" onclick="showAddProvider()">+ Add</button>
      </div>
      <div id="addProviderForm" style="display:none;margin-top:6px"></div>
    </div>
    <div class="setting-group">
      <h3>Data</h3>
      <div class="setting-row"><label>Storage</label><button class="btn" onclick="openDataDir()" style="font-size:8px">Open folder</button></div>
      <div style="font-size:8px;color:var(--text3);margin-top:2px">API keys are AES-256-GCM encrypted</div>
    </div>`;
}

window.showAddProvider=function(){
  const type=document.getElementById('addProviderType').value;
  const reg=providerRegistry[type];if(!reg)return;
  const form=document.getElementById('addProviderForm');
  form.style.display='block';
  form.innerHTML=`
    <div style="font-size:9px;font-weight:600;margin-bottom:4px">${reg.name}</div>
    ${reg.fields.map(f=>`<div class="setting-row"><label>${f.label}</label><input id="field-${f.key}" placeholder="${f.placeholder||''}" style="width:140px;font-size:8px"></div>`).join('')}
    <div class="btn-row"><button class="btn primary" onclick="confirmAddProvider('${type}')">Save</button><button class="btn" onclick="document.getElementById('addProviderForm').style.display='none'">Cancel</button></div>`;
};

window.confirmAddProvider=async function(type){
  const reg=providerRegistry[type];if(!reg)return;
  const cfg=await ipcRenderer.invoke('get-config');
  const provConfig={};
  for(const f of reg.fields){
    provConfig[f.key]=document.getElementById('field-'+f.key)?.value||'';
  }
  if(!cfg.providers)cfg.providers=[];
  cfg.providers.push({
    id:type+'_'+Date.now(),
    type,
    name:provConfig.name||reg.name,
    config:provConfig,
  });
  // Remove masked keys before saving (they come from get-config)
  for(const p of cfg.providers){if(p.config?._apiKeyMasked)delete p.config._apiKeyMasked}
  await ipcRenderer.invoke('save-config',cfg);
  renderSettings();
};

window.removeProvider=async function(idx){
  const cfg=await ipcRenderer.invoke('get-config');
  for(const p of cfg.providers){if(p.config?._apiKeyMasked)delete p.config._apiKeyMasked}
  cfg.providers.splice(idx,1);
  await ipcRenderer.invoke('save-config',cfg);
  renderSettings();
};

window.saveTheme=async function(v){
  const cfg=await ipcRenderer.invoke('get-config');
  for(const p of cfg.providers||[]){if(p.config?._apiKeyMasked)delete p.config._apiKeyMasked}
  if(!cfg.settings)cfg.settings={};
  cfg.settings.theme=v;
  await ipcRenderer.invoke('save-config',cfg);
  applyTheme();
};

window.saveTokenAlert=async function(v){
  const cfg=await ipcRenderer.invoke('get-config');
  for(const p of cfg.providers||[]){if(p.config?._apiKeyMasked)delete p.config._apiKeyMasked}
  if(!cfg.settings)cfg.settings={};
  cfg.settings.tokenAlertThreshold=parseInt(v)||50000;
  await ipcRenderer.invoke('save-config',cfg);
};

window.openDataDir=async function(){
  const p=await ipcRenderer.invoke('get-data-path');
  ipcRenderer.invoke('open-path',p);
};

// ══════════════════════════════════════════════════════════════
// REFRESH
// ══════════════════════════════════════════════════════════════

async function refreshLive(){
  const r=await ipcRenderer.invoke('get-live', currentRange);
  if(r.ok)updateLive(r.sessions);
}

async function refreshHistory(){
  const r=await ipcRenderer.invoke('get-history');
  if(r.ok){histData=r.records;if(histExpanded)drawChart()}
}

async function refreshProviders(){
  const r=await ipcRenderer.invoke('get-providers');
  if(r.ok)renderProviders(r.providers);
}

async function refreshAll(){
  document.getElementById('footerInfo').innerHTML='<span class="spinner"></span>';
  await Promise.all([refreshLive(),refreshHistory(),currentPage==='apis'?refreshProviders():Promise.resolve()]);
  document.getElementById('footerInfo').textContent=new Date().toLocaleTimeString();
}

// Init
refreshAll();
setInterval(refreshLive,10000);
setInterval(refreshHistory,60000);

// Listen for file changes
ipcRenderer.on('data-changed',()=>{refreshLive();refreshHistory()});
</script>
